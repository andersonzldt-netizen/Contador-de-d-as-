<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

    <linearGradient
        id="bg"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

        <stop
            offset="0%"
            stop-color="#12050a"/>

        <stop
            offset="55%"
            stop-color="#5b1828"/>

        <stop
            offset="100%"
            stop-color="#210914"/>

    </linearGradient>


    <linearGradient
        id="heart"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

        <stop
            offset="0%"
            stop-color="#f1b0bc"/>

        <stop
            offset="45%"
            stop-color="#c85b77"/>

        <stop
            offset="100%"
            stop-color="#711c3a"/>

    </linearGradient>


    <filter
        id="glow"
        x="-50%"
        y="-50%"
        width="200%"
        height="200%">

        <feGaussianBlur
            stdDeviation="14"
            result="blur"/>

        <feMerge>

            <feMergeNode
                in="blur"/>

            <feMergeNode
                in="SourceGraphic"/>

        </feMerge>

    </filter>

</defs>


<rect
    width="512"
    height="512"
    rx="110"
    fill="url(#bg)"/>


<circle
    cx="256"
    cy="256"
    r="175"
    fill="none"
    stroke="#c9a35b"
    stroke-opacity=".35"
    stroke-width="3"/>


<circle
    cx="256"
    cy="256"
    r="145"
    fill="none"
    stroke="#e6cb91"
    stroke-opacity=".18"
    stroke-width="2"/>


<path
    d="M256 385
       C238 369 139 292 139 205
       C139 153 177 120 220 120
       C239 120 251 130 256 146
       C261 130 273 120 292 120
       C335 120 373 153 373 205
       C373 292 274 369 256 385Z"
    fill="url(#heart)"
    filter="url(#glow)"/>


<ellipse
    cx="215"
    cy="185"
    rx="34"
    ry="16"
    fill="#ffffff"
    opacity=".28"
    transform="rotate(-25 215 185)"/>


<circle
    cx="256"
    cy="72"
    r="5"
    fill="#e6cb91"/>

</svg>
