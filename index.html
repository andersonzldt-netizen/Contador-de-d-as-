    <style>
        :root {
            --primary: #e11d48;
            --bg-gradient: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 50%, #fce7f3 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border-color: rgba(244, 114, 182, 0.25);
            --shadow: 0 20px 40px -15px rgba(225, 29, 72, 0.15);
        }

        [data-theme="dark"] {
            --primary: #f43f5e;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #2c0b1a 100%);
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(244, 114, 182, 0.15);
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s ease, color 0.3s ease; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .hearts-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .floating-heart { position: absolute; color: var(--primary); opacity: 0.2; animation: floatUp 7s linear infinite; }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg) scale(0.5); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        .container {
            max-width: 400px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px 20px 28px 20px;
            border-radius: 28px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .top-actions { 
            display: flex; 
            justify-content: flex-end; 
            gap: 8px; 
            margin-bottom: 4px;
        }
        
        .icon-btn {
            background: var(--border-color);
            border: none;
            color: var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
        .icon-btn:hover { background: var(--primary); color: white; transform: scale(1.05); }

        .heart-main {
            width: 45px; height: 45px; margin: 0 auto 8px;
            fill: var(--primary);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        h1 { font-family: 'Cinzel', serif; font-size: 1.35rem; letter-spacing: 1px; margin-bottom: 4px; color: var(--primary); }
        .subtitle { font-size: 0.8rem; margin-bottom: 16px; opacity: 0.8; font-weight: 500; }

        .carousel-container {
            background: #ffffff;
            padding: 10px 10px 22px 10px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            margin-bottom: 16px;
            position: relative;
        }
        .carousel-view {
            width: 100%;
            height: 230px;
            overflow: hidden;
            border-radius: 8px;
            position: relative;
            touch-action: pan-y;
            background: #e2e8f0;
        }

        .carousel-track {
            display: flex;
            width: 300%;
            height: 100%;
        }
        .carousel-slide {
            width: 33.3333%;
            height: 100%;
            flex-shrink: 0;
        }
