<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia Juntos ❤️ - Bri</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e11d48;
            --primary-light: #fda4af;
            --bg-gradient: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 50%, #fce7f3 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border-color: rgba(244, 114, 182, 0.3);
            --shadow: 0 20px 40px -10px rgba(225, 29, 72, 0.15);
        }

        [data-theme="dark"] {
            --primary: #f43f5e;
            --primary-light: #fb7185;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #2c0b1a 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(244, 114, 182, 0.2);
            --shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Contenedor de corazones flotantes animados */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            color: var(--primary);
            opacity: 0.3;
            animation: floatUp 6s linear infinite;
            font-size: 1.2rem;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.6);
                opacity: 0;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 36px 24px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeInScale 0.8s ease-out;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .top-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: transform 0.2s, background 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            background: var(--border-color);
        }

        .heart-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            animation: heartbeat 1.2s infinite;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--primary), #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
            font-weight: 500;
        }

        /* Foto estilo Polaroid animada */
        .polaroid {
            background: white;
            padding: 12px 12px 28px 12px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            margin-bottom: 24px;
            transform: rotate(-1.5deg);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.03);
        }

        .polaroid img {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 8px;
        }

        .polaroid-caption {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #333;
            font-size: 0.95rem;
            margin-top: 10px;
        }

        /* Cuadrícula del Contador con efecto hover */
        .counter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .counter-box {
            background: var(--border-color);
            padding: 12px 8px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .counter-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(225, 29, 72, 0.1);
        }

        .counter-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .counter-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .dedication {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
            60% { transform: scale(1); }
        }
    </style>
</head>
<body data-theme="light">

    <div class="hearts-bg" id="heartsBg"></div>

    <div class="container">
        <div class="top-actions">
            <button class="icon-btn" onclick="toggleAudio()" id="audioBtn" title="Reproducir música">🎵</button>
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Cambiar tema">🌙</button>
        </div>
        
        <div class="heart-icon">💖</div>
        <h1>Nuestra Historia Juntos</h1>
        <p class="subtitle" id="fechaInicioTexto">Desde el 29 de marzo de 2026</p>

        <div class="polaroid">
            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=600&q=80" alt="Nosotros">
            <div class="polaroid-caption">¿Hacemos esto oficial? ✨</div>
        </div>

        <div class="counter-grid">
            <div class="counter-box">
                <span class="counter-number" id="anos">0</span>
                <span class="counter-label">Años</span>
            </div>
            <div class="counter-box">
                <span class="counter-number" id="meses">0</span>
                <span class="counter-label">Meses</span>
            </div>
            <div class="counter-box">
                <span class="counter-number" id="dias">0</span>
                <span class="counter-label">Días</span>
            </div>
            <div class="counter-box">
                <span class="counter-number" id="horas">0</span>
                <span class="counter-label">Horas</span>
            </div>
            <div class="counter-box">
                <span class="counter-number" id="minutos">0</span>
                <span class="counter-label">Minutos</span>
            </div>
            <div class="counter-box">
                <span class="counter-number" id="segundos">0</span>
                <span class="counter-label">Segundos</span>
            </div>
        </div>

        <div class="dedication">
            "Cada segundo a tu lado es mi lugar favorito. Te amo, Bri." 🌹
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-tenderness.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Generador dinámico de corazones flotantes de fondo
        function crearCorazonFlotante() {
            const bg = document.getElementById('heartsBg');
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's'; // Entre 4 y 7 segundos
            heart.style.fontSize = (Math.random() * 10 + 12) + 'px';
            bg.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }
        setInterval(crearCorazonFlotante, 600);

        // Fecha oficial: 29 de marzo de 2026
        const fechaInicio = new Date(2026, 2, 29, 0, 0, 0); 

        function actualizarContador() {
            const ahora = new Date();
            let diferencia = ahora - fechaInicio;
            if (diferencia < 0) diferencia = 0;

            const segundosTotales = Math.floor(diferencia / 1000);
            const minutosTotales = Math.floor(segundosTotales / 60);
            const horasTotales = Math.floor(minutosTotales / 60);

            const segundos = segundosTotales % 60;
            const minutos = minutosTotales % 60;
            const horas = horasTotales % 24;

            let anos = ahora.getFullYear() - fechaInicio.getFullYear();
            let meses = ahora.getMonth() - fechaInicio.getMonth();
            let dias = ahora.getDate() - fechaInicio.getDate();

            if (dias < 0) {
                meses--;
                const mesAnterior = new Date(ahora.getFullYear(), ahora.getMonth(), 0);
                dias += mesAnterior.getDate();
            }

            if (meses < 0) {
                anos--;
                meses += 12;
            }

            document.getElementById('anos').innerText = anos;
            document.getElementById('meses').innerText = meses;
            document.getElementById('dias').innerText = dias;
            document.getElementById('horas').innerText = horas;
            document.getElementById('minutos').innerText = minutos;
            document.getElementById('segundos').innerText = segundos;
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                btn.innerHTML = '☀️';
            } else {
                body.setAttribute('data-theme', 'light');
                btn.innerHTML = '🌙';
            }
        }

        let reproduciendo = false;
        function toggleAudio() {
            const audio = document.getElementById('bgMusic');
            const btn = document.getElementById('audioBtn');
            if (reproduciendo) {
                audio.pause();
                btn.innerHTML = '🎵';
                reproduciendo = false;
            } else {
                audio.play().then(() => {
                    btn.innerHTML = '⏸️';
                    reproduciendo = true;
                }).catch(e => console.log("Audio bloqueado por navegador"));
            }
        }

        setInterval(actualizarContador, 1000);
        actualizarContador();
    </script>
</body>
</html>
